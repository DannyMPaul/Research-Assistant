<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Research Assistant v4.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Dark Mode Toggle Styles */
        .dark-mode-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            width: 60px;
            height: 30px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            padding: 2px;
        }

        .dark-mode-toggle .toggle-slider {
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        body.dark-mode .dark-mode-toggle {
            background: rgba(30, 30, 46, 0.3);
            border: 1px solid rgba(100, 100, 130, 0.3);
        }

        body.dark-mode .dark-mode-toggle .toggle-slider {
            transform: translateX(28px);
            background: #1e293b;
            color: #fbbf24;
        }

        /* Dark Mode Universal Styles */
        body.dark-mode {
            background-color: #0f172a !important;
            color: #f1f5f9 !important;
        }

        /* All backgrounds become dark */
        body.dark-mode .bg-gray-50 { background-color: #0f172a !important; }
        body.dark-mode .bg-white { background-color: #1e293b !important; }
        body.dark-mode .bg-gray-100 { background-color: #334155 !important; }
        body.dark-mode .bg-gray-200 { background-color: #475569 !important; }
        body.dark-mode .bg-gray-300 { background-color: #64748b !important; }
        body.dark-mode .bg-blue-50 { background-color: #1e293b !important; }

        /* All text becomes light */
        body.dark-mode .text-gray-900 { color: #f8fafc !important; }
        body.dark-mode .text-gray-800 { color: #f1f5f9 !important; }
        body.dark-mode .text-gray-700 { color: #e2e8f0 !important; }
        body.dark-mode .text-gray-600 { color: #cbd5e1 !important; }
        body.dark-mode .text-gray-500 { color: #94a3b8 !important; }

        /* Buttons in dark mode */
        body.dark-mode .bg-blue-600 { background-color: #3b82f6 !important; }
        body.dark-mode .bg-purple-600 { background-color: #9333ea !important; }
        body.dark-mode .bg-green-600 { background-color: #16a34a !important; }
        body.dark-mode .bg-gray-600 { background-color: #4b5563 !important; }

        /* Hover states in dark mode */
        body.dark-mode .hover\\:bg-gray-100:hover { background-color: #374151 !important; }
        body.dark-mode .hover\\:bg-blue-700:hover { background-color: #2563eb !important; }
        body.dark-mode .hover\\:bg-purple-700:hover { background-color: #7c3aed !important; }
        body.dark-mode .hover\\:bg-green-700:hover { background-color: #15803d !important; }
        body.dark-mode .hover\\:bg-gray-700:hover { background-color: #374151 !important; }
        body.dark-mode .hover\\:bg-blue-50:hover { background-color: #334155 !important; }

        /* Borders in dark mode */
        body.dark-mode .border-gray-200 { border-color: #475569 !important; }
        body.dark-mode .border-gray-300 { border-color: #64748b !important; }

        /* Input fields in dark mode */
        body.dark-mode input, body.dark-mode textarea {
            background-color: #1e293b !important;
            color: #f1f5f9 !important;
            border-color: #475569 !important;
        }

        body.dark-mode input::placeholder, body.dark-mode textarea::placeholder {
            color: #94a3b8 !important;
        }

        /* Chat message styles */
        .message {
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 12px;
            max-width: 80%;
            position: relative;
            group: hover;
        }

        .message.user {
            background-color: #3b82f6;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .message.assistant {
            background-color: #f3f4f6;
            color: #1f2937;
            margin-right: auto;
        }

        .message-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: none;
            background: rgba(0,0,0,0.1);
            border-radius: 4px;
            padding: 2px;
        }

        .message:hover .message-actions {
            display: flex;
        }

        .keyboard-shortcuts {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            display: none;
            z-index: 1000;
        }

        body.dark-mode .message.assistant {
            background-color: #374151 !important;
            color: #f1f5f9 !important;
        }

        body.dark-mode .message.user {
            background-color: #6366f1 !important;
            color: #ffffff !important;
        }

        /* Upload area in dark mode */
        body.dark-mode .hover\\:border-blue-500:hover {
            border-color: #3b82f6 !important;
        }

        /* Smooth transitions for all elements */
        * {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Dark Mode Toggle -->
    <div class="dark-mode-toggle" id="darkModeToggle" onclick="toggleDarkMode()">
        <div class="toggle-slider" id="toggleSlider">
            ☀️
        </div>
    </div>

    <div class="container mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">Document Research Assistant</h1>
            <p class="text-gray-600">Upload documents, search, and chat with AI</p>
            <div class="text-sm text-gray-500 mt-2">Version 4.0.0 - AI-Powered Q&A with Llama</div>
        </header>

        <!-- Navigation Tabs -->
        <div class="max-w-4xl mx-auto mb-8">
            <div class="flex space-x-1 bg-gray-200 p-1 rounded-lg">
                <button id="search-tab" onclick="switchTab('search')" class="flex-1 py-2 px-4 bg-white text-gray-900 rounded-md shadow-sm">
                    Search Documents
                </button>
                <button id="chat-tab" onclick="switchTab('chat')" class="flex-1 py-2 px-4 text-gray-600 rounded-md hover:bg-gray-100">
                    AI Chat
                </button>
                <button id="upload-tab" onclick="switchTab('upload')" class="flex-1 py-2 px-4 text-gray-600 rounded-md hover:bg-gray-100">
                    Manage Documents
                </button>
            </div>
        </div>

        <!-- Search Tab Content -->
        <div id="search-content" class="max-w-4xl mx-auto space-y-8">
            <div class="w-full max-w-2xl mx-auto">
                <div class="mb-4">
                    <div class="flex space-x-2 mb-2">
                        <button id="keyword-search-btn" onclick="setSearchMode('keyword')" class="px-4 py-2 bg-blue-600 text-white rounded-lg">
                            Keyword Search
                        </button>
                        <button id="semantic-search-btn" onclick="setSearchMode('semantic')" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg">
                            AI Semantic Search
                        </button>
                        <button id="enhanced-search-btn" onclick="setSearchMode('enhanced')" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg">
                            Smart Search + AI
                        </button>
                    </div>
                    <div class="flex space-x-2">
                        <div class="relative flex-1">
                            <input 
                                type="text" 
                                id="search-input" 
                                placeholder="Search across all documents..." 
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                onkeypress="handleSearchEnter(event)"
                                oninput="showSearchHistory()"
                                onfocus="showSearchHistory()"
                                onblur="hideSearchHistory()"
                            >
                            <div id="search-history" class="absolute top-full left-0 right-0 bg-white border border-gray-200 rounded-lg shadow-lg z-10 hidden max-h-40 overflow-y-auto">
                            </div>
                        </div>
                        <button 
                            onclick="performSearch()" 
                            class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 focus:ring-2 focus:ring-blue-500"
                        >
                            Search
                        </button>
                    </div>
                </div>
                <div id="search-results" class="mt-4 hidden"></div>
            </div>
        </div>

        <!-- Chat Tab Content -->
        <div id="chat-content" class="max-w-4xl mx-auto space-y-8 hidden">
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold">AI Chat Assistant</h2>
                    <div class="flex space-x-2">
                        <button onclick="startNewConversation()" class="px-3 py-1 bg-green-600 text-white text-sm rounded hover:bg-green-700">
                            New Chat
                        </button>
                        <button onclick="loadConversations()" class="px-3 py-1 bg-gray-600 text-white text-sm rounded hover:bg-gray-700">
                            History
                        </button>
                        <button onclick="exportChat()" class="px-3 py-1 bg-blue-600 text-white text-sm rounded hover:bg-blue-700">
                            Export
                        </button>
                    </div>
                </div>
                
                <div id="chat-messages" class="h-96 overflow-y-auto border border-gray-200 rounded-lg p-4 mb-4 bg-gray-50">
                    <div class="text-center text-gray-500 py-8">
                        Start a conversation by asking a question about your documents
                    </div>
                </div>
                
                <div class="flex space-x-2">
                    <input 
                        type="text" 
                        id="chat-input" 
                        placeholder="Ask a question about your documents..."
                        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        onkeypress="handleChatEnter(event)"
                    >
                    <button 
                        onclick="sendChatMessage()" 
                        id="send-button"
                        class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 focus:ring-2 focus:ring-purple-500"
                    >
                        Send
                    </button>
                </div>
                
                <div id="chat-status" class="mt-2 text-sm text-gray-500"></div>
            </div>
            
            <!-- Conversation History -->
            <div id="conversation-history" class="bg-white rounded-lg shadow-md p-6 hidden">
                <h3 class="text-lg font-semibold mb-4">Recent Conversations</h3>
                <div id="conversations-list" class="space-y-2"></div>
            </div>
        </div>

        <!-- Upload Tab Content -->
        <div id="upload-content" class="max-w-4xl mx-auto space-y-8 hidden">
            <div class="w-full max-w-md mx-auto">
                <div id="upload-area" class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center transition-colors hover:border-blue-500 hover:bg-blue-50">
                    <input type="file" id="file-input" accept=".pdf,.docx,.txt" class="hidden">
                    <label for="file-input" class="cursor-pointer block">
                        <div class="space-y-2">
                            <div class="text-gray-500">Drop files here or click to upload</div>
                            <div class="text-sm text-gray-400">PDF, DOCX, TXT files only</div>
                        </div>
                    </label>
                </div>
                <div id="upload-status" class="mt-4 text-center hidden"></div>
            </div>

            <div class="w-full max-w-2xl mx-auto">
                <h2 class="text-xl font-semibold mb-4">Your Documents</h2>
                <div id="documents-list" class="space-y-2">
                    <div class="text-gray-500 text-center py-8">Loading documents...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8002';
        let currentSearchMode = 'keyword';
        let currentConversationId = null;
        let chatEnabled = false;
        let searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');
        let editingMessageId = null;
        
        // Dark Mode Functions
        function toggleDarkMode() {
            const body = document.body;
            const toggleSlider = document.getElementById('toggleSlider');
            
            body.classList.toggle('dark-mode');
            
            // Update toggle icon
            if (body.classList.contains('dark-mode')) {
                toggleSlider.innerHTML = '🌙';
                localStorage.setItem('darkMode', 'enabled');
            } else {
                toggleSlider.innerHTML = '☀️';
                localStorage.setItem('darkMode', 'disabled');
            }
        }

        // Load saved dark mode preference
        function loadDarkModePreference() {
            const darkMode = localStorage.getItem('darkMode');
            if (darkMode === 'enabled') {
                document.body.classList.add('dark-mode');
                document.getElementById('toggleSlider').innerHTML = '🌙';
            }
        }
        
        // Search history functions
        function addToSearchHistory(query) {
            if (!query || query.length < 2) return;
            searchHistory = searchHistory.filter(item => item !== query);
            searchHistory.unshift(query);
            searchHistory = searchHistory.slice(0, 10);
            localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
        }
        
        function showSearchHistory() {
            const historyDiv = document.getElementById('search-history');
            const input = document.getElementById('search-input');
            const query = input.value.toLowerCase();
            
            let filteredHistory = searchHistory;
            if (query) {
                filteredHistory = searchHistory.filter(item => item.toLowerCase().includes(query));
            }
            
            if (filteredHistory.length === 0) {
                historyDiv.classList.add('hidden');
                return;
            }
            
            historyDiv.innerHTML = filteredHistory.map(item => 
                `<div class="px-3 py-2 hover:bg-gray-100 cursor-pointer text-sm" onmousedown="selectSearchHistory('${item.replace(/'/g, '\\\'')}')">${item}</div>`
            ).join('');
            historyDiv.classList.remove('hidden');
        }
        
        function hideSearchHistory() {
            setTimeout(() => {
                document.getElementById('search-history').classList.add('hidden');
            }, 200);
        }
        
        function selectSearchHistory(query) {
            document.getElementById('search-input').value = query;
            hideSearchHistory();
            performSearch();
        }
        
        // Tab switching
        function switchTab(tabName) {
            const tabs = ['search', 'chat', 'upload'];
            tabs.forEach(tab => {
                document.getElementById(`${tab}-tab`).className = 'flex-1 py-2 px-4 text-gray-600 rounded-md hover:bg-gray-100';
                document.getElementById(`${tab}-content`).classList.add('hidden');
            });
            
            document.getElementById(`${tabName}-tab`).className = 'flex-1 py-2 px-4 bg-white text-gray-900 rounded-md shadow-sm';
            document.getElementById(`${tabName}-content`).classList.remove('hidden');
            
            if (tabName === 'upload') {
                loadDocuments();
            } else if (tabName === 'chat') {
                checkChatStatus();
            }
        }
        
        // Search functionality
        function setSearchMode(mode) {
            currentSearchMode = mode;
            const keywordBtn = document.getElementById('keyword-search-btn');
            const semanticBtn = document.getElementById('semantic-search-btn');
            const enhancedBtn = document.getElementById('enhanced-search-btn');
            const searchInput = document.getElementById('search-input');
            
            keywordBtn.className = 'px-4 py-2 bg-gray-300 text-gray-700 rounded-lg';
            semanticBtn.className = 'px-4 py-2 bg-gray-300 text-gray-700 rounded-lg';
            enhancedBtn.className = 'px-4 py-2 bg-gray-300 text-gray-700 rounded-lg';
            
            if (mode === 'keyword') {
                keywordBtn.className = 'px-4 py-2 bg-blue-600 text-white rounded-lg';
                searchInput.placeholder = 'Search for exact keywords...';
            } else if (mode === 'semantic') {
                semanticBtn.className = 'px-4 py-2 bg-purple-600 text-white rounded-lg';
                searchInput.placeholder = 'Describe what you\'re looking for...';
            } else if (mode === 'enhanced') {
                enhancedBtn.className = 'px-4 py-2 bg-green-600 text-white rounded-lg';
                searchInput.placeholder = 'Ask a question and get AI answers...';
            }
        }
        
        function handleSearchEnter(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }
        
        async function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            const resultsDiv = document.getElementById('search-results');
            
            if (!query) {
                resultsDiv.classList.add('hidden');
                return;
            }
            
            addToSearchHistory(query);
            hideSearchHistory();
            
            resultsDiv.innerHTML = '<div class="text-gray-500 p-4">Searching...</div>';
            resultsDiv.classList.remove('hidden');
            
            try {
                let endpoint;
                if (currentSearchMode === 'semantic') {
                    endpoint = `${API_BASE}/api/search/semantic?q=${encodeURIComponent(query)}&limit=5`;
                } else if (currentSearchMode === 'enhanced') {
                    endpoint = `${API_BASE}/api/search/enhanced?q=${encodeURIComponent(query)}&generate_answer=true&limit=5`;
                } else {
                    endpoint = `${API_BASE}/api/search?q=${encodeURIComponent(query)}`;
                }
                
                const response = await fetch(endpoint);
                const data = await response.json();
                
                displaySearchResults(data);
            } catch (error) {
                resultsDiv.innerHTML = '<div class="text-red-500 p-4">Search error occurred</div>';
            }
        }
        
        function displaySearchResults(data) {
            const resultsDiv = document.getElementById('search-results');
            
            if (currentSearchMode === 'enhanced' && data.ai_answer) {
                resultsDiv.innerHTML = `
                    <div class="bg-white border rounded-lg p-6 mb-4">
                        <div class="flex items-center mb-4">
                            <div class="w-3 h-3 bg-green-500 rounded-full mr-2"></div>
                            <h3 class="font-semibold text-green-700">AI Answer</h3>
                            <span class="ml-2 text-xs bg-green-100 text-green-800 px-2 py-1 rounded">
                                ${Math.round(data.ai_answer.confidence * 100)}% confidence
                            </span>
                        </div>
                        <div class="text-gray-800 mb-4 leading-relaxed">${data.ai_answer.answer}</div>
                        <details class="mt-4">
                            <summary class="text-sm text-gray-600 cursor-pointer">Sources (${data.ai_answer.sources.length})</summary>
                            <div class="mt-2 space-y-2">
                                ${data.ai_answer.sources.map(source => `
                                    <div class="text-xs bg-gray-50 p-2 rounded">
                                        <strong>${source.filename}</strong> - ${source.preview}
                                    </div>
                                `).join('')}
                            </div>
                        </details>
                    </div>
                    ${displayRegularResults(data.results)}
                `;
            } else if (data.results) {
                resultsDiv.innerHTML = displayRegularResults(data.results);
            } else if (data.documents) {
                displayKeywordResults(data);
            } else {
                resultsDiv.innerHTML = '<div class="text-gray-500 p-4">No results found</div>';
            }
        }
        
        function displayRegularResults(results) {
            if (!results || results.length === 0) {
                return '<div class="text-gray-500 p-4">No semantic matches found</div>';
            }
            
            return `
                <div class="bg-white border rounded-lg p-4">
                    <h3 class="font-semibold mb-3">Search Results (${results.length} matches)</h3>
                    <div class="space-y-3">
                        ${results.map(result => `
                            <div class="border-l-4 border-purple-500 pl-4">
                                <div class="flex justify-between items-start mb-2">
                                    <h4 class="font-medium text-purple-600">${result.filename}</h4>
                                    <span class="text-xs bg-purple-100 text-purple-800 px-2 py-1 rounded">
                                        ${Math.round(result.similarity_score * 100)}% match
                                    </span>
                                </div>
                                <div class="text-sm text-gray-700 bg-gray-50 p-3 rounded">
                                    ${result.chunk_text.length > 300 ? result.chunk_text.substring(0, 300) + '...' : result.chunk_text}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
        
        function displayKeywordResults(data) {
            if (data.documents.length === 0) {
                return '<div class="text-gray-500 p-4">No keyword matches found</div>';
            }
            
            return `
                <div class="bg-white border rounded-lg p-4">
                    <h3 class="font-semibold mb-3">Keyword Results (${data.total_documents} documents)</h3>
                    ${data.documents.map(doc => `
                        <div class="mb-4 last:mb-0">
                            <h4 class="font-medium text-blue-600">${doc.filename}</h4>
                            <p class="text-sm text-gray-600">${doc.matches} matches found</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        // Chat functionality
        async function checkChatStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/chat/status`);
                const status = await response.json();
                chatEnabled = status.llm_available;
                
                document.getElementById('chat-status').textContent = 
                    chatEnabled ? '✅ AI Chat Ready' : '⚠️ AI Chat Unavailable (Search mode only)';
            } catch (error) {
                chatEnabled = false;
                document.getElementById('chat-status').textContent = '❌ Connection Error';
            }
        }
        
        function handleChatEnter(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendChatMessage();
            }
        }
        
        async function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const question = input.value.trim();
            const sendButton = document.getElementById('send-button');
            
            if (!question) return;
            
            addMessageToChat('user', question);
            input.value = '';
            sendButton.disabled = true;
            sendButton.textContent = 'Thinking...';
            
            try {
                const response = await fetch(`${API_BASE}/api/chat/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        conversation_id: currentConversationId
                    })
                });
                
                const data = await response.json();
                currentConversationId = data.conversation_id;
                
                addMessageToChat('assistant', data.answer, data.sources, data.confidence);
            } catch (error) {
                addMessageToChat('assistant', 'Sorry, I encountered an error. Please try again.');
            }
            
            sendButton.disabled = false;
            sendButton.textContent = 'Send';
        }
        
        function addMessageToChat(role, content, sources = [], confidence = null, messageId = null) {
            const chatMessages = document.getElementById('chat-messages');
            
            if (chatMessages.children.length === 1 && chatMessages.children[0].classList.contains('text-center')) {
                chatMessages.innerHTML = '';
            }
            
            const messageDiv = document.createElement('div');
            const msgId = messageId || Date.now().toString();
            messageDiv.className = `message ${role === 'user' ? 'user' : 'assistant'}`;
            messageDiv.setAttribute('data-message-id', msgId);
            
            if (role === 'user') {
                messageDiv.innerHTML = `
                    <div class="message-actions">
                        <button onclick="editMessage('${msgId}')" class="text-xs px-1 py-0.5 bg-white bg-opacity-20 rounded hover:bg-opacity-40">✏️</button>
                        <button onclick="deleteMessage('${msgId}')" class="text-xs px-1 py-0.5 bg-white bg-opacity-20 rounded hover:bg-opacity-40 ml-1">🗑️</button>
                    </div>
                    <div class="message-content">${content}</div>
                `;
            } else {
                const confidenceBar = confidence ? `
                    <div class="text-xs opacity-75 mb-2">
                        Confidence: ${Math.round(confidence * 100)}%
                        <div class="w-full bg-gray-300 rounded-full h-1 mt-1">
                            <div class="bg-green-500 h-1 rounded-full" style="width: ${confidence * 100}%"></div>
                        </div>
                    </div>
                ` : '';
                
                const sourcesHtml = sources && sources.length > 0 ? `
                    <details class="mt-2">
                        <summary class="text-xs opacity-75 cursor-pointer">Sources (${sources.length})</summary>
                        <div class="mt-2 space-y-1">
                            ${sources.map(source => `
                                <div class="text-xs bg-black bg-opacity-10 p-2 rounded">
                                    <strong>${source.filename}</strong><br>
                                    ${source.preview}
                                </div>
                            `).join('')}
                        </div>
                    </details>
                ` : '';
                
                messageDiv.innerHTML = `
                    <div class="message-actions">
                        <button onclick="deleteMessage('${msgId}')" class="text-xs px-1 py-0.5 bg-black bg-opacity-10 rounded hover:bg-opacity-20">🗑️</button>
                    </div>
                    <div class="message-content">
                        ${confidenceBar}
                        ${content}
                        ${sourcesHtml}
                    </div>
                `;
            }
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        async function startNewConversation() {
            try {
                const response = await fetch(`${API_BASE}/api/chat/conversations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                
                const data = await response.json();
                currentConversationId = data.conversation_id;
                
                document.getElementById('chat-messages').innerHTML = `
                    <div class="text-center text-gray-500 py-8">
                        New conversation started. Ask a question about your documents.
                    </div>
                `;
            } catch (error) {
                console.error('Failed to start new conversation:', error);
            }
        }
        
        async function loadConversations() {
            const historyDiv = document.getElementById('conversation-history');
            const listDiv = document.getElementById('conversations-list');
            
            try {
                const response = await fetch(`${API_BASE}/api/chat/conversations`);
                const data = await response.json();
                
                if (data.conversations.length === 0) {
                    listDiv.innerHTML = '<div class="text-gray-500 text-center py-4">No conversations yet</div>';
                } else {
                    listDiv.innerHTML = data.conversations.map(conv => `
                        <div class="border rounded p-3 hover:bg-gray-50 cursor-pointer" onclick="loadConversation('${conv.id}')">
                            <div class="font-medium text-sm">${conv.last_question || 'New conversation'}</div>
                            <div class="text-xs text-gray-500">${new Date(conv.created_at).toLocaleString()}</div>
                            <div class="text-xs text-gray-400">${conv.total_questions} messages</div>
                        </div>
                    `).join('');
                }
                
                historyDiv.classList.toggle('hidden');
            } catch (error) {
                console.error('Failed to load conversations:', error);
            }
        }
        
        async function loadConversation(conversationId) {
            try {
                const response = await fetch(`${API_BASE}/api/chat/conversations/${conversationId}`);
                const data = await response.json();
                
                currentConversationId = conversationId;
                const chatMessages = document.getElementById('chat-messages');
                chatMessages.innerHTML = '';
                
                data.messages.forEach(msg => {
                    addMessageToChat('user', msg.question);
                    addMessageToChat('assistant', msg.answer, msg.sources, msg.confidence);
                });
                
                document.getElementById('conversation-history').classList.add('hidden');
            } catch (error) {
                console.error('Failed to load conversation:', error);
            }
        }
        
        // Export chat functionality
        function exportChat() {
            const chatMessages = document.getElementById('chat-messages');
            if (!chatMessages.children.length || chatMessages.children[0].classList.contains('text-center')) {
                alert('No conversation to export');
                return;
            }
            
            let markdown = '# Chat Conversation\n\n';
            markdown += `**Date:** ${new Date().toLocaleString()}\n\n`;
            
            const messages = chatMessages.children;
            for (let i = 0; i < messages.length; i++) {
                const message = messages[i];
                const role = message.classList.contains('user') ? 'User' : 'Assistant';
                const content = message.querySelector('.message-content');
                
                if (content) {
                    const text = content.textContent.trim();
                    markdown += `## ${role}\n\n${text}\n\n`;
                }
            }
            
            const blob = new Blob([markdown], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `chat-${new Date().toISOString().split('T')[0]}.md`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Message editing functions
        function editMessage(messageId) {
            const messageDiv = document.querySelector(`[data-message-id="${messageId}"]`);
            if (!messageDiv || !messageDiv.classList.contains('user')) return;
            
            const contentDiv = messageDiv.querySelector('.message-content');
            const currentText = contentDiv.textContent.trim();
            
            editingMessageId = messageId;
            const input = document.getElementById('chat-input');
            input.value = currentText;
            input.focus();
            
            const sendButton = document.getElementById('send-button');
            sendButton.textContent = 'Update';
            sendButton.onclick = updateMessage;
        }
        
        function updateMessage() {
            if (!editingMessageId) return;
            
            const messageDiv = document.querySelector(`[data-message-id="${editingMessageId}"]`);
            const input = document.getElementById('chat-input');
            const newText = input.value.trim();
            
            if (newText && messageDiv) {
                const contentDiv = messageDiv.querySelector('.message-content');
                contentDiv.textContent = newText;
            }
            
            cancelEdit();
        }
        
        function cancelEdit() {
            editingMessageId = null;
            document.getElementById('chat-input').value = '';
            const sendButton = document.getElementById('send-button');
            sendButton.textContent = 'Send';
            sendButton.onclick = sendChatMessage;
        }
        
        function deleteMessage(messageId) {
            if (confirm('Delete this message?')) {
                const messageDiv = document.querySelector(`[data-message-id="${messageId}"]`);
                if (messageDiv) {
                    messageDiv.remove();
                }
            }
        }
        
        // Upload functionality
        const fileInput = document.getElementById('file-input');
        const uploadArea = document.getElementById('upload-area');
        const uploadStatus = document.getElementById('upload-status');
        
        fileInput.addEventListener('change', handleFileSelect);
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('border-blue-500', 'bg-blue-50');
        });
        
        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-blue-500', 'bg-blue-50');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('border-blue-500', 'bg-blue-50');
            
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        
        function handleFileSelect(e) {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        }
        
        async function handleFile(file) {
            if (!file.name.match(/\.(pdf|docx|txt)$/i)) {
                showStatus('Unsupported file type. Use PDF, DOCX, or TXT.', 'error');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', file);
            
            showStatus('Uploading...', 'info');
            
            try {
                const response = await fetch(`${API_BASE}/api/upload`, {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const result = await response.json();
                    showStatus(`✅ Uploaded: ${file.name}`, 'success');
                    loadDocuments();
                } else {
                    const error = await response.json();
                    showStatus(`❌ Upload failed: ${error.detail}`, 'error');
                }
            } catch (error) {
                showStatus(`❌ Upload error: ${error.message}`, 'error');
            }
        }
        
        function showStatus(message, type) {
            uploadStatus.className = `mt-4 text-center ${type === 'error' ? 'text-red-600' : type === 'success' ? 'text-green-600' : 'text-blue-600'}`;
            uploadStatus.textContent = message;
            uploadStatus.classList.remove('hidden');
            
            if (type === 'success') {
                setTimeout(() => {
                    uploadStatus.classList.add('hidden');
                }, 3000);
            }
        }
        
        async function loadDocuments() {
            try {
                const response = await fetch(`${API_BASE}/api/documents`);
                const data = await response.json();
                
                const documentsList = document.getElementById('documents-list');
                
                if (data.documents.length === 0) {
                    documentsList.innerHTML = '<div class="text-gray-500 text-center py-8">No documents uploaded yet</div>';
                } else {
                    documentsList.innerHTML = data.documents.map(doc => `
                        <div class="border rounded-lg p-4 hover:bg-gray-50 transition-colors">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h3 class="font-medium text-gray-900">${doc.filename}</h3>
                                    <p class="text-sm text-gray-500">${formatFileSize(doc.size)}</p>
                                </div>
                                <div class="flex space-x-2">
                                    <button onclick="embedDocument('${doc.file_id}')" class="text-purple-600 hover:text-purple-800 text-sm">
                                        Process for AI
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                document.getElementById('documents-list').innerHTML = '<div class="text-red-500 text-center py-8">Error loading documents</div>';
            }
        }
        
        async function embedDocument(fileId) {
            try {
                const response = await fetch(`${API_BASE}/api/document/${fileId}/embed`, {
                    method: 'POST'
                });
                const data = await response.json();
                
                alert(`Document processed! Created ${data.chunks_created} text chunks for AI search.`);
            } catch (error) {
                alert('Processing failed. Please try again.');
            }
        }
        
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
        
        // Keyboard shortcuts
        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey || e.metaKey) {
                    switch(e.key) {
                        case '1':
                            e.preventDefault();
                            switchTab('search');
                            break;
                        case '2':
                            e.preventDefault();
                            switchTab('chat');
                            break;
                        case '3':
                            e.preventDefault();
                            switchTab('upload');
                            break;
                        case 'k':
                            e.preventDefault();
                            document.getElementById('search-input').focus();
                            break;
                        case 'Enter':
                            if (document.activeElement.id === 'search-input') {
                                e.preventDefault();
                                performSearch();
                            }
                            break;
                        case 'Escape':
                            e.preventDefault();
                            if (editingMessageId) {
                                cancelEdit();
                            }
                            break;
                    }
                }
                
                if (e.key === '?' && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    toggleKeyboardHelp();
                }
            });
        }
        
        function toggleKeyboardHelp() {
            let helpDiv = document.getElementById('keyboard-help');
            if (!helpDiv) {
                helpDiv = document.createElement('div');
                helpDiv.id = 'keyboard-help';
                helpDiv.className = 'keyboard-shortcuts';
                helpDiv.innerHTML = `
                    <div><strong>Keyboard Shortcuts:</strong></div>
                    <div>Ctrl+1: Search Tab</div>
                    <div>Ctrl+2: Chat Tab</div>
                    <div>Ctrl+3: Upload Tab</div>
                    <div>Ctrl+K: Focus Search</div>
                    <div>?: Toggle Help</div>
                    <div>Esc: Cancel Edit</div>
                `;
                document.body.appendChild(helpDiv);
            }
            
            helpDiv.style.display = helpDiv.style.display === 'none' ? 'block' : 'none';
            
            if (helpDiv.style.display === 'block') {
                setTimeout(() => {
                    helpDiv.style.display = 'none';
                }, 3000);
            }
        }
        
        // Initialize app
        document.addEventListener('DOMContentLoaded', function() {
            loadDarkModePreference();
            setupKeyboardShortcuts();
            switchTab('search');
            loadDocuments();
        });
    </script>
</body>
</html>
